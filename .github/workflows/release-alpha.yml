name: Publish Practical Toolkit Alpha 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-alpha.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install practical toolkit
        run: python -m pip install .

      - name: Validate public project state
        run: python scripts/validate_project_state.py

      - name: Validate benchmark corpus
        run: |
          python scripts/validate_suite_contracts.py
          python scripts/audit_corpus.py --require-cases 50
          python scripts/evaluate_suite.py --predictions reference --require-cases 50

      - name: Validate practical workflows
        run: |
          sao demo --output /tmp/sao-release-demo
          sao incident validate /tmp/sao-release-demo
          sao incident analyze /tmp/sao-release-demo --output /tmp/sao-release-demo/reanalysis
          sao quickcheck demo --output /tmp/sao-release-quick.csv --report-output /tmp/sao-release-quick-report
          sao reconcile demo --output /tmp/sao-release-reconcile
          sao normalize demo --output /tmp/sao-release-normalize
          sao workbench /tmp/sao-release-demo --output /tmp/sao-release-workbench.html
          python -m unittest discover -s tests -p 'test_*toolkit.py' -v

      - name: Validate release metadata
        shell: bash
        run: |
          grep -q 'version = "0.4.0a1"' pyproject.toml
          grep -q '__version__ = "0.4.0a1"' sao_toolkit/__init__.py
          grep -q '0.4.0-alpha.1' README.md
          test -f release/PRODUCT-0.4.0-alpha.1.md

      - name: Create tag and GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.0-alpha.1
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; release step is idempotent."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "SAO Practical Toolkit 0.4.0-alpha.1"
          git push origin "$TAG"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SAO Practical Toolkit 0.4.0-alpha.1" \
            --notes-file release/PRODUCT-0.4.0-alpha.1.md \
            --prerelease \
            --verify-tag
