name: Publish Product Page

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"
      - "assets/social-preview.png"
      - "scripts/stage_pages.py"
      - ".github/workflows/product-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage product and documentation source
        run: python3 scripts/stage_pages.py --output _pages-source
      - name: Build readable documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages-source
          destination: ./_site
      - name: Add consent-aware portfolio analytics
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          node scripts/inject-portfolio-analytics.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
