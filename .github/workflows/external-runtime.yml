name: SAO external runtime evaluation

on:
  workflow_dispatch:
    inputs:
      runtime_name:
        description: Human-readable runtime/framework name
        required: true
        type: string
      runtime_version:
        description: Exact runtime/framework version
        required: true
        type: string
      model_provider:
        description: Model provider (optional)
        required: false
        type: string
      model_name:
        description: Model name (optional; required when provider is set)
        required: false
        type: string
      model_version:
        description: Model/version snapshot if known
        required: false
        type: string
      capability_profile:
        description: Declared maximum capability profile
        required: true
        default: SAO-Diagnostic
        type: string
      policy_profile:
        description: Policy/approval profile identifier
        required: true
        default: explicit-human-approval
        type: string
      notes:
        description: Experiment notes
        required: false
        type: string

permissions:
  contents: read

env:
  SAO_ADAPTER_URL: ${{ secrets.SAO_ADAPTER_URL }}
  SAO_ADAPTER_TOKEN: ${{ secrets.SAO_ADAPTER_TOKEN }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact benchmark commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require configured HTTPS runtime endpoint
        shell: bash
        run: |
          if [ -z "$SAO_ADAPTER_URL" ]; then
            echo "Repository secret SAO_ADAPTER_URL is required." >&2
            exit 2
          fi
          case "$SAO_ADAPTER_URL" in
            https://*) ;;
            *) echo "SAO_ADAPTER_URL must use HTTPS for external runtimes." >&2; exit 2 ;;
          esac

      - name: Validate project and corpus
        run: |
          python scripts/validate_project_state.py
          python scripts/validate_suite_contracts.py
          python scripts/audit_corpus.py --require-cases 50 --json --output sao-corpus-audit.json

      - name: Check external adapter conformance
        run: |
          python scripts/check_adapter_conformance.py -- python adapters/http_endpoint.py
          python scripts/check_adapter_conformance.py --json -- python adapters/http_endpoint.py > sao-adapter-conformance.json

      - name: Run external runtime across SAO-Bench
        run: python scripts/run_adapter.py --output sao-runtime-predictions.jsonl -- python adapters/http_endpoint.py

      - name: Score external runtime without hiding benchmark failures
        shell: bash
        run: |
          set +e
          python scripts/evaluate_suite.py --predictions sao-runtime-predictions.jsonl --require-cases 50 --json > sao-runtime-report.json
          rc=$?
          set -e
          test -s sao-runtime-report.json
          echo "benchmark_exit_code=$rc" >> "$GITHUB_ENV"
          echo "SAO benchmark evaluator exit code: $rc (non-zero means control failures, not workflow infrastructure failure)"

      - name: Materialize non-secret configuration fingerprints
        shell: bash
        env:
          RUNTIME_NAME: ${{ inputs.runtime_name }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          MODEL_PROVIDER: ${{ inputs.model_provider }}
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_VERSION: ${{ inputs.model_version }}
          CAPABILITY_PROFILE: ${{ inputs.capability_profile }}
          POLICY_PROFILE: ${{ inputs.policy_profile }}
        run: |
          python - <<'PY'
          import json, os
          agent = {
              "runtime_name": os.environ["RUNTIME_NAME"],
              "runtime_version": os.environ["RUNTIME_VERSION"],
              "model_provider": os.environ.get("MODEL_PROVIDER") or None,
              "model_name": os.environ.get("MODEL_NAME") or None,
              "model_version": os.environ.get("MODEL_VERSION") or None,
              "capability_profile": os.environ["CAPABILITY_PROFILE"],
              "policy_profile": os.environ["POLICY_PROFILE"],
              "adapter": "adapters/http_endpoint.py"
          }
          tools = {
              "adapter_protocol": "SAO Runtime Adapter 0.1",
              "transport": "HTTPS",
              "endpoint_configured_via_secret": True,
              "bearer_token_present": bool(os.environ.get("SAO_ADAPTER_TOKEN")),
              "benchmark_truth_exposed": False
          }
          open("sao-agent-config.json", "w", encoding="utf-8").write(json.dumps(agent, indent=2, sort_keys=True) + "\n")
          open("sao-tool-manifest.json", "w", encoding="utf-8").write(json.dumps(tools, indent=2, sort_keys=True) + "\n")
          PY

      - name: Build experiment manifest
        shell: bash
        env:
          RUNTIME_NAME: ${{ inputs.runtime_name }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          MODEL_PROVIDER: ${{ inputs.model_provider }}
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_VERSION: ${{ inputs.model_version }}
          CAPABILITY_PROFILE: ${{ inputs.capability_profile }}
          POLICY_PROFILE: ${{ inputs.policy_profile }}
          NOTES: ${{ inputs.notes }}
        run: |
          experiment_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          args=(
            --experiment-id "$experiment_id"
            --result-kind runtime_evaluation
            --runtime-name "$RUNTIME_NAME"
            --runtime-version "$RUNTIME_VERSION"
            --adapter adapters/http_endpoint.py
            --agent-config sao-agent-config.json
            --tool-manifest sao-tool-manifest.json
            --capability-profile "$CAPABILITY_PROFILE"
            --policy-profile "$POLICY_PROFILE"
            --predictions artifact://sao-runtime-predictions.jsonl
            --report artifact://sao-runtime-report.json
            --audit artifact://sao-corpus-audit.json
            --runner github-actions/ubuntu-latest
            --notes "$NOTES"
            --output sao-experiment-manifest.json
          )
          if [ -n "$MODEL_PROVIDER" ] || [ -n "$MODEL_NAME" ] || [ -n "$MODEL_VERSION" ]; then
            if [ -z "$MODEL_PROVIDER" ] || [ -z "$MODEL_NAME" ]; then
              echo "model_provider and model_name must be supplied together" >&2
              exit 2
            fi
            args+=(--model-provider "$MODEL_PROVIDER" --model-name "$MODEL_NAME")
            if [ -n "$MODEL_VERSION" ]; then
              args+=(--model-version "$MODEL_VERSION")
            fi
          fi
          python scripts/build_experiment_manifest.py "${args[@]}"
          mkdir -p /tmp/sao-experiments
          cp sao-experiment-manifest.json /tmp/sao-experiments/runtime.json
          python scripts/validate_experiments.py --manifest-dir /tmp/sao-experiments

      - name: Build machine-readable Assurance Case
        shell: bash
        env:
          RUNTIME_NAME: ${{ inputs.runtime_name }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          python scripts/build_assurance_case.py \
            --benchmark-report sao-runtime-report.json \
            --benchmark-report-ref artifact://sao-runtime-report.json \
            --experiment-manifest sao-experiment-manifest.json \
            --subject-kind runtime_configuration \
            --subject-name "$RUNTIME_NAME" \
            --subject-version "$RUNTIME_VERSION" \
            --assurance-case-id "sao-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output sao-assurance-case.json
          python scripts/validate_assurance_case.py sao-assurance-case.json

      - name: Build human-readable Assurance Review
        run: |
          python scripts/build_review_report.py \
            --benchmark-report sao-runtime-report.json \
            --corpus-audit sao-corpus-audit.json \
            --adapter-conformance sao-adapter-conformance.json \
            --experiment-manifest sao-experiment-manifest.json \
            --output sao-assurance-review.md

      - name: Build benchmark integrity manifest
        run: python scripts/build_release_manifest.py --version 0.3-dev --output sao-release-manifest.json

      - name: Upload complete external runtime evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sao-external-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sao-runtime-predictions.jsonl
            sao-runtime-report.json
            sao-corpus-audit.json
            sao-adapter-conformance.json
            sao-agent-config.json
            sao-tool-manifest.json
            sao-experiment-manifest.json
            sao-assurance-case.json
            sao-assurance-review.md
            sao-release-manifest.json
