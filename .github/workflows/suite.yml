name: SAO full suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project public state
        run: python scripts/validate_project_state.py

      - name: Validate benchmark contracts and coverage
        run: python scripts/validate_suite_contracts.py

      - name: Audit benchmark corpus for release readiness
        run: |
          python scripts/audit_corpus.py --require-cases 50
          python scripts/audit_corpus.py --require-cases 50 --json --output sao-corpus-audit.json

      - name: Validate experiment provenance
        run: python scripts/validate_experiments.py

      - name: Run 50+ case benchmark self-test
        run: python scripts/evaluate_suite.py --predictions reference --require-cases 50

      - name: Profile deterministic baseline strategies
        run: python scripts/check_baselines.py > sao-baseline-profiles.json

      - name: Smoke-test runtime-neutral adapter protocol
        run: |
          python scripts/run_adapter.py --output guarded-adapter.jsonl -- python adapters/guarded_rules.py
          python baselines/generate.py guarded-rules --output guarded-direct.jsonl
          cmp guarded-adapter.jsonl guarded-direct.jsonl

      - name: Check adapter conformance contract
        run: |
          python scripts/check_adapter_conformance.py -- python adapters/guarded_rules.py
          python scripts/check_adapter_conformance.py --json -- python adapters/guarded_rules.py > sao-adapter-conformance.json

      - name: Run simulator and adapter safety tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate good SAO trace
        run: python scripts/evaluate_trace.py traces/examples/valid-approved-write.jsonl

      - name: Ensure unsafe traces are detected
        shell: bash
        run: |
          for trace in \
            traces/examples/invalid-capability-escalation.jsonl \
            traces/examples/invalid-untrusted-memory-policy.jsonl \
            traces/examples/invalid-safe-answer-after-write.jsonl \
            traces/examples/invalid-tool-output-instruction.jsonl
          do
            if python scripts/evaluate_trace.py "$trace"; then
              echo "negative trace unexpectedly passed: $trace" >&2
              exit 1
            fi
          done

      - name: Smoke-test unified CLI
        run: python sao.py doctor

      - name: Emit suite report
        run: python scripts/evaluate_suite.py --predictions reference --require-cases 50 --json > sao-suite-report.json

      - name: Emit positive trace report
        run: python scripts/evaluate_trace.py traces/examples/valid-approved-write.jsonl --json > sao-trace-report.json

      - name: Emit bounded harness assurance case
        run: |
          python scripts/build_assurance_case.py \
            --benchmark-report sao-suite-report.json \
            --benchmark-report-ref artifact://sao-suite-report.json \
            --trace-report sao-trace-report.json \
            --trace-report-ref artifact://sao-trace-report.json \
            --subject-kind harness \
            --subject-name "SAO reference harness" \
            --subject-version 0.3-dev \
            --assurance-case-id sao-harness-v03 \
            --output sao-assurance-case.json
          python scripts/validate_assurance_case.py sao-assurance-case.json

      - name: Emit human-readable assurance review
        run: |
          python scripts/build_review_report.py \
            --benchmark-report sao-suite-report.json \
            --corpus-audit sao-corpus-audit.json \
            --adapter-conformance sao-adapter-conformance.json \
            --trace-report sao-trace-report.json \
            --output sao-assurance-review.md

      - name: Emit benchmark integrity manifest
        run: python scripts/build_release_manifest.py --version 0.3-dev --output sao-release-manifest.json

      - name: Upload suite evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: sao-full-suite-report
          path: |
            sao-corpus-audit.json
            sao-adapter-conformance.json
            sao-suite-report.json
            sao-trace-report.json
            sao-assurance-case.json
            sao-assurance-review.md
            sao-baseline-profiles.json
            sao-release-manifest.json
