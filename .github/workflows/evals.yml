name: SAO benchmark

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('schemas').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('valid json:', path)

          for path in [Path('evals/cases.jsonl'), Path('evals/predictions.reference.jsonl')]:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.strip():
                      json.loads(line)
              print('valid jsonl:', path)
          PY

      - name: Run benchmark self-test
        run: python scripts/evaluate.py --predictions evals/predictions.reference.jsonl

      - name: Emit machine-readable benchmark report
        run: python scripts/evaluate.py --predictions evals/predictions.reference.jsonl --json > benchmark-report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: sao-benchmark-report
          path: benchmark-report.json
