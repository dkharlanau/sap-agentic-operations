name: SAO practical toolkit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install practical CLI
        run: python -m pip install .

      - name: Exercise all bundled SAP failure scenarios
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              'missing-current-event': 'current_outbound_event_not_proven',
              'business-rejection': 'business_processing_rejection',
              'mapping-drift': 'mapping_version_drift',
              'target-mismatch': 'target_state_mismatch_after_current_event',
              'technical-failure': 'technical_message_failure',
              'resolved': 'business_state_verified',
              'identity-unresolved': 'identity_ambiguous_or_unresolved',
              'stale-target-observation': 'target_observation_stale',
              'target-identity-mismatch': 'message_target_identity_mismatch',
          }
          for scenario, classification in expected.items():
              root = Path('/tmp') / f'sao-{scenario}'
              subprocess.run([
                  'sao', 'demo', '--scenario', scenario,
                  '--output', str(root), '--force'
              ], check=True)
              report = json.loads((root / 'sao-output' / 'incident-report.json').read_text())
              assert report['classification'] == classification, (scenario, report)
              assert report['execution_allowed'] is False
          print(f'all {len(expected)} practical scenarios: OK')
          PY

      - name: Validate Evidence Pack through installed CLI
        run: sao incident validate /tmp/sao-missing-current-event

      - name: Re-analyze Evidence Pack through installed CLI
        run: sao incident analyze /tmp/sao-missing-current-event --output /tmp/sao-missing-current-event/reanalysis

      - name: Run practical toolkit unit tests
        run: python -m unittest discover -s tests -p 'test_incident_toolkit.py' -v

      - name: Upload practical demo report
        uses: actions/upload-artifact@v4
        with:
          name: sao-practical-demo
          path: |
            /tmp/sao-missing-current-event/incident.json
            /tmp/sao-missing-current-event/sao-output/incident-report.json
            /tmp/sao-missing-current-event/sao-output/incident-report.md
