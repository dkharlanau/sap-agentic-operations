[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-agentic-operations"
version = "0.4.0a1"
description = "Local-first evidence and incident analysis toolkit for SAP-heavy enterprise operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dzmitryi Kharlanau"}]
keywords = [
  "sap",
  "sap-ams",
  "sap-s4hana",
  "enterprise-architecture",
  "incident-analysis",
  "master-data",
  "integration",
  "agentic-ai",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dkharlanau/sap-agentic-operations"
Documentation = "https://dkharlanau.github.io/sap-agentic-operations/docs/"
Issues = "https://github.com/dkharlanau/sap-agentic-operations/issues"

[project.scripts]
sao = "sao_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["sao_toolkit*"]
